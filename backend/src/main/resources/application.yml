spring:
  config:
    import: optional:file:./.env[.properties]
  application:
    name: study-vault
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/studyvault}
    username: ${DB_USER:studyvault}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: ${MAX_FILE_MB:25}MB
      max-request-size: ${MAX_FILE_MB:25}MB
server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never
app:
  jwt:
    secret: ${JWT_SECRET}
    expiry-hours: ${JWT_EXPIRY_HOURS:12}
  storage:
    dir: ${STORAGE_DIR:./data/files}
    max-file-mb: ${MAX_FILE_MB:25}
    quota-mb: ${STORAGE_QUOTA_MB:1024}
  openrouter:
    api-key: ${OPENROUTER_API_KEY:}
    model: ${OPENROUTER_MODEL:openai/gpt-4o-mini}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
  cookie:
    secure: ${COOKIE_SECURE:false}
