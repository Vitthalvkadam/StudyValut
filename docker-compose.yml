# Local PostgreSQL for development only.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: studyvault
      POSTGRES_USER: studyvault
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in your shell or a root .env file}
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
volumes:
  pgdata:
